<script type="text/javascript">
    function generateNodeLabel() {
        if (this.name) return this.name;
        var raw = this.topic;
        if (!raw) return this.type === 'mqtt-topic-selector-in' ? "mqtt-topic-selector-in" : "mqtt-topic-selector-out";

        var topicName = raw;
        var isComfort = (this.comfortMode === "true" || this.comfortMode === true);
        if (isComfort && this.fetchedLookup) {
            var lookup = {};
            try { lookup = JSON.parse(this.fetchedLookup); } catch(e) {}
            Object.keys(lookup).forEach(function(id) {
                if (topicName.includes(id)) topicName = topicName.split(id).join(lookup[id]);
            });
        }

        var brokerNode = RED.nodes.node(this.broker);
        var brokerName = brokerNode ? (brokerNode.name || brokerNode.broker) : "unknown broker";

        return "Subscribe topic " +topicName+ " from " + brokerName;
    }

    function setupTopicBrowser(buttonId, brokerInputId, realTopicId, visualTopicId, comfortId, topicsStorageId, lookupStorageId, labelTopicId, configDivId, toggleBtnId) {

        function getLabeledTopic(raw, lookup, isComfort) {
            if (!isComfort || !lookup || !raw) return raw;
            let label = raw;
            Object.keys(lookup).forEach(id => {
                if (label.includes(id)) label = label.split(id).join(lookup[id]);
            });
            return label;
        }

        let savedTopics = [];
        let savedLookup = {};

        try {
            savedTopics = JSON.parse($(topicsStorageId).val() || "[]");
            savedLookup = JSON.parse($(lookupStorageId).val() || "{}");
        } catch(e) {}

        function applyComfortMode() {
            let isComfort = ($(comfortId).val() === "true");
            let currentRaw = $(realTopicId).val();

            if (isComfort) {
                $(toggleBtnId).parent().show();
                $(labelTopicId).html('<i class="fa fa-tasks"></i> labeled Topic');
                $(visualTopicId).val(getLabeledTopic(currentRaw, savedLookup, true));
            } else {
                $(toggleBtnId).parent().hide();
                $(configDivId).hide();
                $(toggleBtnId).find("i").removeClass("fa-caret-up").addClass("fa-caret-down");
                $(labelTopicId).html('<i class="fa fa-tasks"></i> Topic');
                $(visualTopicId).val(currentRaw);
            }

            let acData = [];
            let seenLabels = new Set();
            savedTopics.forEach(function(t) {
                let lbl = getLabeledTopic(t, savedLookup, isComfort);
                if (!seenLabels.has(lbl)) {
                    seenLabels.add(lbl);
                    acData.push({ label: lbl, value: t });
                }
            });
            $(visualTopicId).autocomplete("option", "source", acData);
        }

        $(toggleBtnId).click(function(e) {
            e.preventDefault();
            var icon = $(this).find("i");
            if (icon.hasClass("fa-caret-down")) {
                icon.removeClass("fa-caret-down").addClass("fa-caret-up");
                $(configDivId).slideDown();
            } else {
                icon.removeClass("fa-caret-up").addClass("fa-caret-down");
                $(configDivId).slideUp();
            }
        });

        function updatePatternVisibility() {
            var val = $(configDivId).find('.pattern-select').val();
            $(configDivId).find('.exact-row, .minmax-row, .custom-regex-row').hide();
            if (val === "exact")  $(configDivId).find('.exact-row').show();
            else if (val === "minmax") $(configDivId).find('.minmax-row').show();
            else if (val === "custom") $(configDivId).find('.custom-regex-row').show();
        }
        $(configDivId).find('.pattern-select').change(updatePatternVisibility);
        updatePatternVisibility();

        $(visualTopicId).autocomplete({
            minLength: 0,
            source: [],
            select: function(event, ui) {
                $(realTopicId).val(ui.item.value);
                $(visualTopicId).val(ui.item.label);
                return false;
            },
            focus: function(event, ui) {
                $(visualTopicId).val(ui.item.label);
                return false;
            }
        });

        $(visualTopicId).click(function() { $(this).autocomplete("search", ""); });

        $(visualTopicId).on('blur', function() {
            if ($(comfortId).val() === "true") {
                $(this).val(getLabeledTopic($(realTopicId).val(), savedLookup, true));
            }
        });

        $(visualTopicId).on('input', function() {
            if ($(comfortId).val() !== "true") {
                $(realTopicId).val($(this).val());
            }
        });

        applyComfortMode();
        $(comfortId).change(function() { applyComfortMode(); });

        $(buttonId).click(function() {
            var brokerId = $(brokerInputId).val();
            if (!brokerId || brokerId === "_ADD_") {
                RED.notify("Please select and deploy a broker.", "warning");
                return;
            }
            var btn = $(this);
            var originalText = btn.html();
            btn.html('<i class="fa fa-spinner fa-spin"></i> Listening...');
            btn.prop('disabled', true);

            var reqData = {
                broker:       brokerId,
                idPattern:    $(configDivId).find('.pattern-select').val(),
                idLengthExact:$(configDivId).find('.id-length-exact').val(),
                idLengthMin:  $(configDivId).find('.id-length-min').val(),
                idLengthMax:  $(configDivId).find('.id-length-max').val(),
                idRegex:      $(configDivId).find('.custom-regex-input').val(),
                nameSuffix:   $(configDivId).find('.name-suffix-input').val(),
                nameKeys:     $(configDivId).find('.name-keys-input').val()
            };

            $.ajax({
                url: '/mqtt-browse',
                type: 'GET',
                data: reqData,
                success: function(data) {
                    btn.html(originalText);
                    btn.prop('disabled', false);
                    if (!data.connected) {
                        var msg = data.error ? "Connection failed: " + data.error : "Connection to broker failed (check TLS, port, or credentials).";
                        RED.notify(msg, "error");
                        return;
                    }
                    if (data.topics && data.topics.length > 0) {
                        savedTopics = data.topics;
                        savedLookup = data.lookup || {};
                        $(topicsStorageId).val(JSON.stringify(savedTopics));
                        $(lookupStorageId).val(JSON.stringify(savedLookup));
                        applyComfortMode();
                        $(visualTopicId).autocomplete("search", "");
                        RED.notify(data.topics.length + " topics received.", "success");
                    } else {
                        RED.notify("Connected, but no topics received (no retained messages and no live traffic in 5s).", "info");
                    }
                },
                error: function() {
                    btn.html(originalText);
                    btn.prop('disabled', false);
                    RED.notify("Error while browsing.", "error");
                }
            });
        });
    }

    // --- INPUT NODE ---
    RED.nodes.registerType('mqtt-topic-selector-in', {
        category: 'network',
        defaults: {
            name:           { value: "" },
            topic:          { value: "" },
            qos:            { value: "0" },
            broker:         { type: "mqtt-broker", required: true },
            comfortMode:    { value: "true" },
            idPattern:      { value: "exact" },
            idLengthExact:  { value: 32 },
            idLengthMin:    { value: 10 },
            idLengthMax:    { value: 40 },
            idRegex:        { value: "^[a-zA-Z0-9\\-_]{32}$" },
            nameSuffix:     { value: "/announce" },
            nameKeys:       { value: "name,title,deviceName" },
            fetchedTopics:  { value: "[]" },
            fetchedLookup:  { value: "{}" }
        },
        color: "#d8bfd8",
        inputs: 0,
        outputs: 1,
        icon: "bridge.svg",
        label: generateNodeLabel,
        labelStyle: function() { return this.name ? "node_label_italic" : ""; },
        oneditprepare: function() {
            if (!this.idPattern)     $("#node-input-idPattern").val("exact");
            if (!this.idLengthExact) $("#node-input-idLengthExact").val(32);
            if (!this.idLengthMin)   $("#node-input-idLengthMin").val(10);
            if (!this.idLengthMax)   $("#node-input-idLengthMax").val(40);
            if (!this.nameSuffix)    $("#node-input-nameSuffix").val("/announce");
            if (!this.nameKeys)      $("#node-input-nameKeys").val("name,title,deviceName");

            setupTopicBrowser(
                '#node-browse-button-in', '#node-input-broker',
                '#node-input-topic', '#node-input-topicVisual',
                '#node-input-comfortMode',
                '#node-input-fetchedTopics', '#node-input-fetchedLookup',
                '#label-topic-in', '#comfort-settings-in', '#advanced-toggle-in'
            );
        }
    });

    // --- OUTPUT NODE ---
    RED.nodes.registerType('mqtt-topic-selector-out', {
        category: 'network',
        defaults: {
            name:           { value: "" },
            topic:          { value: "" },
            qos:            { value: "0" },
            retain:         { value: "false" },
            broker:         { type: "mqtt-broker", required: true },
            comfortMode:    { value: "true" },
            idPattern:      { value: "exact" },
            idLengthExact:  { value: 32 },
            idLengthMin:    { value: 10 },
            idLengthMax:    { value: 40 },
            idRegex:        { value: "^[a-zA-Z0-9\\-_]{32}$" },
            nameSuffix:     { value: "/announce" },
            nameKeys:       { value: "name,title,deviceName" },
            fetchedTopics:  { value: "[]" },
            fetchedLookup:  { value: "{}" }
        },
        color: "#d8bfd8",
        inputs: 1,
        outputs: 0,
        icon: "bridge.svg",
        align: "right",
        label: generateNodeLabel,
        labelStyle: function() { return this.name ? "node_label_italic" : ""; },
        oneditprepare: function() {
            if (!this.idPattern)     $("#node-input-idPattern").val("exact");
            if (!this.idLengthExact) $("#node-input-idLengthExact").val(32);
            if (!this.idLengthMin)   $("#node-input-idLengthMin").val(10);
            if (!this.idLengthMax)   $("#node-input-idLengthMax").val(40);
            if (!this.nameSuffix)    $("#node-input-nameSuffix").val("/announce");
            if (!this.nameKeys)      $("#node-input-nameKeys").val("name,title,deviceName");

            setupTopicBrowser(
                '#node-browse-button-out', '#node-input-broker',
                '#node-input-topic', '#node-input-topicVisual',
                '#node-input-comfortModeOut',
                '#node-input-fetchedTopics', '#node-input-fetchedLookup',
                '#label-topic-out', '#comfort-settings-out', '#advanced-toggle-out'
            );
        }
    });
</script>

<script type="text/html" data-help-name="mqtt-topic-selector-in">
    <p><b>MQTT Topic Selector (Input)</b></p>
    <p>Subscribes to an MQTT broker topic. Uses the <b>mqtt-broker</b> config node for the full connection setup including TLS, protocol version (v3/v4/v5), keepalive, clean session, birth/will/close messages, and credentials.</p>
    <ul>
        <li><b>Broker</b>: MQTT broker config node (required)</li>
        <li><b>Topic</b>: Topic to subscribe to (supports wildcards, required)</li>
        <li><b>QoS</b>: Quality of Service (0, 1, 2)</li>
        <li><b>Comfort</b>: Enables device name mapping</li>
        <li><b>ID-Detection for Comfort-Mode</b>: ID recognition type (exact length, min/max, regex)</li>
        <li><b>Info-Topic</b>: Suffix for device-announce topics (default: /announce)</li>
        <li><b>JSON Keys</b>: Fields to extract device names (default: name,title,deviceName)</li>
    </ul>
    <p><b>Outputs</b>: <code>payload</code>, <code>topic</code>, <code>qos</code>, <code>retain</code>, and MQTTv5 properties (<code>responseTopic</code>, <code>correlationData</code>, <code>contentType</code>, <code>userProperties</code>, <code>messageExpiryInterval</code>).</p>
    <p><b>Comfort Mode</b>: Use the <b>Listen</b> button to browse topics and build a device-name mapping. IDs in topic names are replaced with readable labels in the dropdown.</p>
</script>

<script type="text/html" data-help-name="mqtt-topic-selector-out">
    <p><b>MQTT Topic Selector (Output)</b></p>
    <p>Publishes messages to an MQTT broker. Uses the <b>mqtt-broker</b> config node for the full connection setup including TLS, protocol version (v3/v4/v5), keepalive, clean session, birth/will/close messages, and credentials.</p>
    <ul>
        <li><b>Broker</b>: MQTT broker config node (required)</li>
        <li><b>Topic</b>: Topic to publish to (required, or pass via <code>msg.topic</code>)</li>
        <li><b>QoS</b>: Quality of Service (0, 1, 2)</li>
        <li><b>Retain</b>: Retain flag (true/false)</li>
        <li><b>Comfort</b>: Enables device name mapping</li>
        <li><b>ID-Detection for Comfort-Mode</b>: ID recognition type (exact length, min/max, regex)</li>
        <li><b>Info-Topic</b>: Suffix for device-announce topics (default: /announce)</li>
        <li><b>JSON Keys</b>: Fields to extract device names (default: name,title,deviceName)</li>
    </ul>
    <p><b>Inputs</b>: <code>payload</code>, <code>topic</code>, <code>qos</code>, <code>retain</code>, and MQTTv5 properties (<code>responseTopic</code>, <code>correlationData</code>, <code>contentType</code>, <code>userProperties</code>, <code>messageExpiryInterval</code>, <code>topicAlias</code>).</p>
    <p><b>Comfort Mode</b>: Use the <b>Listen</b> button to browse topics and build a device-name mapping. IDs in topic names are replaced with readable labels in the dropdown.</p>
</script>
